version: 2
updates:
  - package-ecosystem: nuget
    directory: "/playwright"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      nuget-major:
        patterns:
          - "*"
        update-types:
          - major
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: "/.github/vrt"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
