name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [playwright]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    env:
      VRT_APIURL: http://localhost:4200
      VRT_APIKEY: DEFAULTUSERAPIKEYTOBECHANGED
      VRT_PROJECT: Default project
      VRT_BRANCHNAME: master
      VRT_ENABLESOFTASSERT: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Start Visual Regression Tracker
        working-directory: .github/vrt
        run: docker compose up -d --quiet-pull
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build
      - run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps --only-shell chromium
      - name: Wait for Visual Regression Tracker
        run: timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:4200; do sleep 2; done'
      - run: dotnet test --no-build --output detailed
